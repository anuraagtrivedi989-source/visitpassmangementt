
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: visitpass-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: visitpass-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
